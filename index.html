<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>청춘주막 — 스마트 주문</title>
  <style>
    :root {
      --bg-main: #fcf8f2;
      --card-bg: #ffffff;
      --text-main: #2b2118;
      --text-muted: #8c7a6b;
      --border-color: #eee0d0;
      --primary-color: #8b0000;
      --accent-yellow: #f59e0b;
      --toss-blue: #0064FF;
      --kakao-yellow: #FEE500;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      padding-bottom: 90px;
    }

    header {
      position: sticky;
      top: 0;
      background-color: var(--bg-main);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .brand { font-size: 20px; font-weight: 800; color: var(--primary-color); }
    .table-badge {
      background-color: var(--primary-color);
      color: #fff;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
    }

    .category-nav {
      display: flex;
      overflow-x: auto;
      padding: 12px 16px;
      gap: 8px;
      background-color: var(--bg-main);
      position: sticky;
      top: 57px;
      z-index: 90;
      border-bottom: 1px solid var(--border-color);
      white-space: nowrap;
    }
    .category-nav::-webkit-scrollbar { display: none; }

    .cat-btn {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
    }
    .cat-btn.active {
      background-color: var(--primary-color);
      color: #fff;
      border-color: var(--primary-color);
    }

    .menu-container { padding: 16px; display: grid; gap: 16px; }
    .menu-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .menu-info { flex: 1; padding-right: 12px; }
    .menu-name { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
    .menu-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
    .menu-price { font-size: 16px; font-weight: 800; color: var(--primary-color); }

    .add-btn {
      background-color: #f8f1e7;
      color: var(--primary-color);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    .cart-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background-color: var(--card-bg);
      border-top: 1px solid var(--border-color);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 200;
    }

    .cart-info { font-size: 15px; font-weight: 600; }
    .cart-total { font-size: 18px; font-weight: 800; color: var(--primary-color); }

    .btn-order {
      background-color: var(--primary-color);
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 300;
    }

    .modal-content {
      background-color: var(--card-bg);
      width: 100%;
      max-height: 85vh;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 24px;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-title { font-size: 18px; font-weight: 800; }
    .close-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-muted); }

    /* 결제 수단 선택 라디오 그룹 */
    .pay-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 16px 0;
    }

    .pay-option-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      font-size: 15px;
      transition: all 0.2s;
    }

    .pay-option-label.selected {
      border-color: var(--primary-color);
      background-color: #fcf4f4;
    }

    .pay-option-label input[type="radio"] { display: none; }

    .bank-info-box {
      background-color: #faf6f0;
      border: 1px solid var(--border-color);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      color: var(--text-main);
      text-align: center;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">🍶 청춘주막</div>
    <div class="table-badge" id="table-display">테이블 --</div>
  </header>

  <nav class="category-nav" id="category-container">
    <button class="cat-btn active" onclick="filterCategory('전체')">전체</button>
  </nav>

  <main class="menu-container" id="menu-container">
    <div style="text-align: center; padding: 40px; color: var(--text-muted);">메뉴를 불러오는 중입니다...</div>
  </main>

  <div class="cart-bar">
    <div>
      <div class="cart-info">총 <span id="cart-count">0</span>개 선택</div>
      <div class="cart-total" id="cart-total-price">0원</div>
    </div>
    <button class="btn-order" onclick="openOrderModal()">결제하기</button>
  </div>

  <!-- 주문 및 결제수단 선택 모달 -->
  <div class="modal-overlay" id="order-modal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">주문 내역 및 결제</div>
        <button class="close-btn" onclick="closeOrderModal()">✕</button>
      </div>

      <!-- 내역 요약 -->
      <div id="modal-cart-items" style="display: grid; gap: 8px; margin-bottom: 16px; max-height: 120px; overflow-y: auto;"></div>

      <div style="display: flex; justify-content: space-between; font-size: 18px; font-weight: 800; padding: 12px 0; border-top: 1px solid var(--border-color);">
        <span>최종 결제 금액</span>
        <span style="color: var(--primary-color);" id="modal-total-price">0원</span>
      </div>

      <!-- 결제 수단 선택 라디오 버튼 -->
      <div style="font-size: 14px; font-weight: 700; margin-top: 12px;">결제 수단 선택</div>
      <div class="pay-options">
        <label class="pay-option-label selected" id="label-toss" onclick="selectPayOption('toss')">
          <span>💙 토스로 계좌이체</span>
          <input type="radio" name="payMethod" value="toss" checked>
        </label>
        <label class="pay-option-label" id="label-kakao" onclick="selectPayOption('kakao')">
          <span>💛 카카오페이 송금</span>
          <input type="radio" name="payMethod" value="kakao">
        </label>
        <label class="pay-option-label" id="label-bank" onclick="selectPayOption('bank')">
          <span>🏦 일반 계좌이체</span>
          <input type="radio" name="payMethod" value="bank">
        </label>
      </div>

      <!-- 계좌번호 안내 영역 -->
      <div class="bank-info-box" id="bank-info-display">
        입금 계좌: <b>토스뱅크 1234567890</b>
      </div>

      <button class="btn-order" style="width: 100%; padding: 16px; font-size: 18px;" onclick="handleFinalOrder()">
        🚀 결제 앱 이동 및 주문확정
      </button>
    </div>
  </div>

  <script>
    // ==========================================
    // ⚙️ 사장님 설정 영역
    // ==========================================
    const CONFIG = {
      SCRIPT_URL: "https://script.google.com/macros/s/AKfycbzNlkiaA2BNRU-Lr_b6XczmuUxboEcvtU0ywd5uEVO8uoWPKXQykwiB4XlcowsuGT2x/exec",
      BANK_NAME: "토스뱅크",        // 은행명
      ACCOUNT_NUMBER: "100052382872",   // 계좌번호 (숫자만)
      KAKAO_PAY_LINK: "https://qr.kakaopay.com/FHocQNtEp" // 카카오페이 송금 링크
    };

    let allMenu = [];
    let cart = {};
    let currentTable = "1";
    let selectedPayMethod = "toss";

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has('table')) currentTable = urlParams.get('table');
      document.getElementById('table-display').innerText = `테이블 ${currentTable}`;

      // 계좌 안내 기본 세팅
      document.getElementById('bank-info-display').innerHTML = `입금 계좌: <b>${CONFIG.BANK_NAME} ${CONFIG.ACCOUNT_NUMBER}</b>`;
      fetchMenu();
    });

    async function fetchMenu() {
      try {
        const res = await fetch(`${CONFIG.SCRIPT_URL}?action=menu`);
        const data = await res.json();
        if (data.success) {
          allMenu = data.menu || [];
          renderCategoryNav();
          renderMenu('전체');
        }
      } catch (err) {
        document.getElementById('menu-container').innerHTML = `<div style="text-align:center; padding: 40px;">메뉴를 불러오지 못했습니다.</div>`;
      }
    }

    function renderCategoryNav() {
      const categories = ['전체', ...new Set(allMenu.map(m => m.category))];
      const navContainer = document.getElementById('category-container');
      navContainer.innerHTML = categories.map((cat, idx) => `
        <button class="cat-btn ${idx === 0 ? 'active' : ''}" onclick="filterCategory('${cat}', this)">${cat}</button>
      `).join('');
    }

    function filterCategory(cat, btn) {
      if (btn) {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }
      renderMenu(cat);
    }

    function renderMenu(category) {
      const container = document.getElementById('menu-container');
      const filtered = category === '전체' ? allMenu : allMenu.filter(m => m.category === category);

      if (filtered.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding: 40px; color: var(--text-muted);">등록된 메뉴가 없습니다.</div>`;
        return;
      }

      container.innerHTML = filtered.map(item => `
        <div class="menu-card">
          <div class="menu-info">
            <div class="menu-name">${item.name}</div>
            <div class="menu-desc">${item.description || ''}</div>
            <div class="menu-price">${item.price.toLocaleString()}원</div>
          </div>
          <button class="add-btn" onclick="addToCart('${item.id}')">+ 담기</button>
        </div>
      `).join('');
    }

    function addToCart(menuId) {
      const item = allMenu.find(m => m.id === menuId);
      if (!item) return;

      if (cart[menuId]) {
        cart[menuId].qty += 1;
      } else {
        cart[menuId] = { item, qty: 1 };
      }
      updateCartBar();
    }

    function updateCartBar() {
      let totalCount = 0;
      let totalPrice = 0;
      Object.values(cart).forEach(c => {
        totalCount += c.qty;
        totalPrice += c.item.price * c.qty;
      });

      document.getElementById('cart-count').innerText = totalCount;
      document.getElementById('cart-total-price').innerText = `${totalPrice.toLocaleString()}원`;
    }

    function openOrderModal() {
      if (Object.keys(cart).length === 0) {
        alert('메뉴를 선택해 주세요!');
        return;
      }

      const container = document.getElementById('modal-cart-items');
      let totalPrice = 0;

      container.innerHTML = Object.values(cart).map(c => {
        const subtotal = c.item.price * c.qty;
        totalPrice += subtotal;
        return `
          <div style="display: flex; justify-content: space-between; font-size: 14px;">
            <div><b>${c.item.name}</b> x${c.qty}</div>
            <div>${subtotal.toLocaleString()}원</div>
          </div>
        `;
      }).join('');

      document.getElementById('modal-total-price').innerText = `${totalPrice.toLocaleString()}원`;
      document.getElementById('order-modal').style.display = 'flex';
    }

    function closeOrderModal() {
      document.getElementById('order-modal').style.display = 'none';
    }

    // 결제 수단 선택 옵션
    function selectPayOption(method) {
      selectedPayMethod = method;
      document.querySelectorAll('.pay-option-label').forEach(el => el.classList.remove('selected'));
      document.getElementById(`label-${method}`).classList.add('selected');
    }

    // [결제 앱 이동 및 주문확정] 버튼 처리
    async function handleFinalOrder() {
      let totalPrice = 0;
      const items = Object.values(cart).map(c => {
        totalPrice += c.item.price * c.qty;
        return { id: c.item.id, name: c.item.name, price: c.item.price, qty: c.qty };
      });

      // 1. 주문 데이터 백엔드 전송
      const payload = {
        action: "order",
        table: currentTable,
        items: items,
        totalAmount: totalPrice
      };

      try {
        const res = await fetch(CONFIG.SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (data.success) {
          // 2. 결제 수단별 앱 이동 처리
          if (selectedPayMethod === 'toss') {
            const bank = encodeURIComponent(CONFIG.BANK_NAME);
            const account = CONFIG.ACCOUNT_NUMBER;
            window.location.href = `supertoss://send?bank=${bank}&accountNo=${account}&origin=link&amount=${totalPrice}`;
          } else if (selectedPayMethod === 'kakao') {
            if (CONFIG.KAKAO_PAY_LINK && !CONFIG.KAKAO_PAY_LINK.includes("YOUR_")) {
              window.location.href = CONFIG.KAKAO_PAY_LINK;
            }
          }

          alert(`주문이 성공적으로 접수되었습니다!\n입금이 확인되는 대로 조리가 시작됩니다.`);
          cart = {};
          updateCartBar();
          closeOrderModal();
        } else {
          alert('주문 등록 실패: ' + data.message);
        }
      } catch (err) {
        alert('서버 통신 중 오류가 발생했습니다.');
      }
    }
  </script>
</body>
</html>
