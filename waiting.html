<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>청춘주막 - 웨이팅 시스템</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { paper: '#F5EFDD', ink: '#26221C', flag: '#C23B22', night: '#1F2A3C', gold: '#C89B3C' },
        fontFamily: { display: ['"Black Han Sans"', 'sans-serif'], body: ['"Noto Sans KR"', 'sans-serif'] }
      }
    }
  }
</script>
</head>
<body class="bg-paper text-ink font-body min-h-screen p-4">

<!-- 앱스크립트 URL 설정 -->
<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec"; // 본인 앱스크립트 배포 URL 입력
</script>

<!-- 모드 전환 탭 (손님용 / 관리자용) -->
<div class="max-w-md mx-auto mb-4 flex gap-2">
  <button id="tab-user" onclick="switchTab('user')" class="flex-1 py-2 font-display bg-flag text-paper rounded-xl shadow">손님 등록용</button>
  <button id="tab-admin" onclick="switchTab('admin')" class="flex-1 py-2 font-display bg-night text-paper/50 rounded-xl">관리자 전용</button>
</div>

<!-- ================= 손님용 웨이팅 등록 ================= -->
<div id="view-user" class="max-w-md mx-auto bg-white rounded-2xl shadow-lg p-5">
  <h1 class="font-display text-2xl text-center text-flag mb-1">🏮 청춘주막 대기 등록</h1>
  <p class="text-xs text-center text-ink/60 mb-6">성함과 연락처를 남겨주시면 순서대로 안내해 드립니다.</p>

  <form id="waiting-form" onsubmit="registerWaiting(event)" class="space-y-4">
    <div>
      <label class="block text-xs font-bold mb-1">대표자 성함</label>
      <input type="text" id="cust-name" required placeholder="홍길동" class="w-full border-2 border-ink/15 rounded-xl p-3 text-sm focus:outline-none focus:border-flag">
    </div>
    <div>
      <label class="block text-xs font-bold mb-1">전화번호</label>
      <input type="tel" id="cust-phone" required placeholder="010-1234-5678" class="w-full border-2 border-ink/15 rounded-xl p-3 text-sm focus:outline-none focus:border-flag">
    </div>
    <div>
      <label class="block text-xs font-bold mb-1">방문 인원수</label>
      <input type="number" id="cust-count" min="1" value="2" required class="w-full border-2 border-ink/15 rounded-xl p-3 text-sm focus:outline-none focus:border-flag">
    </div>

    <button type="submit" id="btn-submit" class="w-full bg-flag text-paper font-display text-lg py-3 rounded-xl shadow active:scale-95 transition-transform">
      대기표 뽑기
    </button>
  </form>

  <!-- 완료 메시지 카드 -->
  <div id="result-card" class="hidden mt-6 text-center border-2 border-flag/30 bg-paper p-4 rounded-xl">
    <p class="text-xs font-bold text-ink/60">대기 접수가 완료되었습니다!</p>
    <p class="font-display text-3xl text-flag my-1">대기 <span id="res-num">0</span>번</p>
    <p class="text-xs text-ink/80">순서가 되면 전화로 안내해 드립니다 🍻</p>
  </div>
</div>

<!-- ================= 관리자용 대기열 관리 ================= -->
<div id="view-admin" class="hidden max-w-md mx-auto bg-white rounded-2xl shadow-lg p-5">
  <div class="flex justify-between items-center mb-4">
    <h2 class="font-display text-xl text-night">📋 실시간 대기목록</h2>
    <button onclick="loadAdminList()" class="bg-night/10 text-night text-xs font-bold px-3 py-1.5 rounded-lg">새로고침</button>
  </div>

  <div id="admin-list" class="space-y-3 max-h-[70vh] overflow-y-auto">
    <p class="text-center text-xs text-ink/40 py-8">목록을 불러오는 중...</p>
  </div>
</div>

<script>
  function switchTab(mode) {
    if (mode === 'user') {
      document.getElementById('view-user').classList.remove('hidden');
      document.getElementById('view-admin').classList.add('hidden');
      document.getElementById('tab-user').className = "flex-1 py-2 font-display bg-flag text-paper rounded-xl shadow";
      document.getElementById('tab-admin').className = "flex-1 py-2 font-display bg-night text-paper/50 rounded-xl";
    } else {
      document.getElementById('view-user').classList.add('hidden');
      document.getElementById('view-admin').classList.remove('hidden');
      document.getElementById('tab-user').className = "flex-1 py-2 font-display bg-flag text-paper/50 rounded-xl";
      document.getElementById('tab-admin').className = "flex-1 py-2 font-display bg-night text-paper rounded-xl shadow";
      loadAdminList();
    }
  }

  // 1. 손님 웨이팅 등록
  async function registerWaiting(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-submit');
    btn.disabled = true;
    btn.innerText = '접수 중...';

    const payload = {
      action: 'register',
      name: document.getElementById('cust-name').value,
      phone: document.getElementById('cust-phone').value,
      count: document.getElementById('cust-count').value
    };

    try {
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (data.success) {
        document.getElementById('res-num').innerText = data.waitNum;
        document.getElementById('result-card').classList.remove('hidden');
        document.getElementById('waiting-form').reset();
      }
    } catch (err) {
      alert('접수 중 오류가 발생했습니다.');
    } finally {
      btn.disabled = false;
      btn.innerText = '대기표 뽑기';
    }
  }

  // 2. 관리자 목록 가져오기
  async function loadAdminList() {
    const listWrap = document.getElementById('admin-list');
    listWrap.innerHTML = `<p class="text-center text-xs text-ink/40 py-8">불러오는 중...</p>`;

    try {
      const res = await fetch(`${SCRIPT_URL}?action=list`);
      const data = await res.json();
      if (data.success) {
        renderAdminList(data.list);
      }
    } catch (err) {
      listWrap.innerHTML = `<p class="text-center text-xs text-flag py-8">오류가 발생했습니다.</p>`;
    }
  }

  // 3. 관리자 목록 렌더링 및 상태 변경 버튼
  function renderAdminList(list) {
    const listWrap = document.getElementById('admin-list');
    if (!list || list.length === 0) {
      listWrap.innerHTML = `<p class="text-center text-xs text-ink/40 py-8">현재 대기팀이 없습니다.</p>`;
      return;
    }

    listWrap.innerHTML = list.reverse().map(item => `
      <div class="border border-ink/10 rounded-xl p-3 flex items-center justify-between bg-paper/30">
        <div>
          <div class="flex items-center gap-2 mb-1">
            <span class="font-display text-lg text-flag">#${item.waitNum}</span>
            <span class="font-bold text-sm">${item.name} (${item.count}명)</span>
            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${getStatusStyle(item.status)}">${item.status}</span>
          </div>
          <p class="text-xs text-ink/60">${item.phone}</p>
        </div>
        
        <div class="flex gap-1">
          <button onclick="updateStatus(${item.rowNum}, '입장')" class="px-2.5 py-1 text-xs font-bold bg-soju text-white rounded-lg">입장</button>
          <button onclick="updateStatus(${item.rowNum}, '대기')" class="px-2.5 py-1 text-xs font-bold bg-gold text-white rounded-lg">대기</button>
          <button onclick="updateStatus(${item.rowNum}, '취소')" class="px-2.5 py-1 text-xs font-bold bg-ink/20 text-ink rounded-lg">취소</button>
        </div>
      </div>
    `).join('');
  }

  function getStatusStyle(status) {
    if (status === '입장') return 'bg-soju/20 text-soju';
    if (status === '대기') return 'bg-gold/20 text-gold';
    return 'bg-ink/10 text-ink/40';
  }

  // 4. 상태 변경 함수 (입장 / 대기 / 취소)
  async function updateStatus(rowNum, status) {
    try {
      await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'updateStatus', rowNum, status })
      });
      loadAdminList();
    } catch (err) {
      alert('상태 변경 실패');
    }
  }
</script>
</body>
</html>
